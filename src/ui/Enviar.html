<script>
/* ===========================================================================
   SINAV · pestana ENVIAR.
   La pregunta de esta pantalla: que puedo mandar hoy, y que me lo esta trabando.
   =========================================================================== */

/**
 * La ventana de trabajo. El libro tiene el ano entero, pero lo que importa un
 * martes de noviembre es noviembre. Lo demas sigue ahi, a un clic.
 */
const VENTANAS = [
  { id: 'mes', et: 'Este mes' },
  { id: 'proximo', et: 'Este mes y el siguiente' },
  { id: 'vencidas', et: 'Vencidas sin cerrar' },
  { id: 'abiertas', et: 'Todo lo abierto' },
  { id: 'todo', et: 'El año entero' }
];

const FILTROS = [
  { id: 'todas', et: 'Por enviar', clave: 'todas' },
  { id: 'sin_soporte', et: 'Sin soporte', clave: 'sin_soporte' },
  { id: 'por_vencer', et: 'Vence en 4 días o menos', clave: 'por_vencer' },
  { id: 'vencidas', et: 'Vencidas', clave: 'vencidas' }
];

function aplicaFiltro(o, filtro) {
  if (filtro === 'sin_soporte') return !o.cadena.soporte;
  if (filtro === 'por_vencer') return o.dias !== null && o.dias >= 0 && o.dias <= 4;
  if (filtro === 'vencidas') return o.dias !== null && o.dias < 0;
  return true;
}

/**
 * El hallazgo del dia: lo que mas necesita atencion, no un resumen.
 * Se arma como texto plano con las cifras en negrilla, para que los espacios
 * entre pedazos no dependan de como htm corte las lineas.
 */
function Hallazgo({ filas, conteos }) {
  if (!filas.length) {
    return html`<p class="hallazgo">No tienes obligaciones por enviar.</p>`;
  }
  const vencidas = filas.filter((o) => o.dias !== null && o.dias < 0);
  const trozos = [];
  const cifra = (n) => html`<b key=${trozos.length}>${n}</b>`;

  trozos.push(cifra(conteos.listas));
  trozos.push(conteos.listas === 1 ? ' lista para enviar' : ' listas para enviar');

  if (vencidas.length) {
    const mas = vencidas.slice().sort((a, b) => a.dias - b.dias)[0];
    trozos.push(', ');
    trozos.push(cifra(vencidas.length));
    trozos.push(vencidas.length === 1 ? ' ya vencida (' : ' ya vencidas (');
    trozos.push(mas.municipio + ' ' + mas.impuesto + ', ' + textoDias(mas.dias) + ')');
  }
  trozos.push('. ');

  if (conteos.sin_soporte) {
    trozos.push(cifra(conteos.sin_soporte));
    trozos.push(conteos.sin_soporte === 1
      ? ' no tiene soporte, así que no se puede seleccionar.'
      : ' no tienen soporte, así que no se pueden seleccionar.');
  } else {
    trozos.push('Todas tienen soporte.');
  }
  return html`<p class="hallazgo">${trozos}</p>`;
}

function TarjetasConteo({ conteos, filtro, alFiltrar }) {
  return html`<fieldset class="conteos">
    <legend>Filtrar la lista</legend>
    ${FILTROS.map((f) => {
      const n = conteos[f.clave] || 0;
      return html`<button key=${f.id} type="button" class="conteo"
        aria-pressed=${filtro === f.id}
        onClick=${() => alFiltrar(f.id)}>
        <span class="et">${f.et}</span>
        <span class=${'vl' + (n === 0 ? ' cero' : '')}>${n}</span>
      </button>`;
    })}
  </fieldset>`;
}

/**
 * Por que esta fila no se puede enviar, en castellano.
 *
 * El servidor manda el motivo tecnico en motivo_no_enviable. Antes solo
 * vivia en el title del checkbox, o sea invisible: la casilla estaba apagada
 * y nadie sabia por que. Ahora se escribe en la fila.
 */
function motivoLegible(o) {
  if (o.mia === false) return 'asignada a otra persona';
  const m = String(o.motivo_no_enviable || '');
  if (!m) return '';
  if (m === 'sin soporte') return 'pendiente cargar el soporte';
  if (m === 'sin correo ni dependencia') {
    return 'sin correo de oficina ni dependencia registrada';
  }
  if (m === 'requiere_envio no es SI') return 'no está marcada para envío por correo';
  if (m.indexOf('no LISTA') >= 0) {
    return 'en estado ' + o.estado + '. El envío solo procede desde LISTA.';
  }
  return m;
}

/**
 * El valor liquidado, editable en la misma fila.
 *
 * Es el dato que mas se escribe y el unico que cambia en cada periodo, asi
 * que abrir una ventana por obligacion para escribir un numero no tiene
 * sentido. Se guarda al salir del campo, no en cada tecla.
 */
function CeldaValor({ o, alGuardar, guardando }) {
  const [texto, setTexto] = useState(o.valor == null ? '' : String(o.valor));
  const [tocado, setTocado] = useState(false);
  const previo = useRef(o.valor == null ? '' : String(o.valor));

  // si la fila se recarga desde el servidor, el campo sigue lo que diga la
  // hoja, salvo que la persona lo esté escribiendo
  useEffect(() => {
    if (tocado) return;
    const v = o.valor == null ? '' : String(o.valor);
    previo.current = v;
    setTexto(v);
  }, [o.valor, tocado]);

  async function salir() {
    setTocado(false);
    if (texto.trim() === previo.current.trim()) return;
    const ok = await alGuardar(o.id, texto);
    if (!ok) setTexto(previo.current);        // no se pudo: se deja como estaba
  }

  return html`<td class="celda-valor num der">
    <input type="text" inputMode="numeric" class="num entrada-valor"
      aria-label=${'Valor liquidado de ' + o.municipio + ' ' + o.impuesto}
      placeholder="—" value=${texto} disabled=${guardando}
      onInput=${(e) => { setTocado(true); setTexto(e.target.value); }}
      onBlur=${salir}
      onKeyDown=${(e) => { if (e.key === 'Enter') e.target.blur(); }} />
    ${guardando ? html`<span class="sub">guardando…</span>` : null}
  </td>`;
}

function Fila({ o, elegida, alElegir, alSubir, subiendo, alGuardarValor,
                guardandoValor }) {
  const puedo = o.enviable && o.mia !== false;
  const porque = puedo ? '' : motivoLegible(o);
  const falta = o.falta_correo || [];
  const nivelVence = o.dias === null ? '' : (o.dias < 0 ? 'vencido' : (o.dias <= 4 ? 'porvencer' : ''));

  return html`<tr data-elegida=${elegida ? 'si' : 'no'}>
    <td class="celda-casilla">
      <input type="checkbox" checked=${elegida} disabled=${!puedo}
        aria-label=${puedo
          ? 'Seleccionar ' + o.municipio + ' ' + o.impuesto + ' ' + o.periodo
          : 'No se puede enviar: ' + o.motivo_no_enviable}
        title=${puedo ? '' : 'No se puede enviar: ' + o.motivo_no_enviable}
        onChange=${() => alElegir(o.id)} />
    </td>

    <td class="celda-mun">
      <span class="ident">${o.municipio}</span>
      <span class="sub">DANE ${o.cod_dane}${o.cod_oficina ? ' · oficina ' + o.cod_oficina : ''}</span>
    </td>

    <td class="celda-linea2">
      <span>${o.impuesto}</span>
      ${o.regimen && o.regimen !== 'GENERAL'
        ? html`<span class="sub">${o.regimen.toLowerCase()}</span>` : null}
    </td>

    <td class="celda-linea2 num">
      <span>${o.periodo}</span>
      <span class="sub dato-tel">${o.periodicidad.toLowerCase()}</span>
    </td>

    <td class="celda-linea2 num der">
      <span>${o.vencimiento || html`<span class="raya">—</span>`}</span>
      <span class=${'sub ' + nivelVence}>${textoDias(o.dias)}</span>
    </td>

    <${CeldaValor} o=${o} alGuardar=${alGuardarValor}
      guardando=${guardandoValor} />

    <td class="celda-linea2">
      <${Cadena} cadena=${o.cadena} trabada=${!o.enviable} />
      ${o.soportes > 1
        ? html`<span class="sub">${o.soportes + ' archivos adjuntos'}</span>` : null}
      ${puedo && falta.length
        ? html`<span class="sub porvencer">${'datos pendientes: ' + falta.join(', ')}</span>`
        : null}
      ${porque
        ? html`<span class="sub vencido">${'no se puede enviar: ' + porque}</span>`
        : (o.cadena.soporte && !o.soporte_revisado
            ? html`<span class="sub porvencer">pendiente de verificación</span>` : null)}
    </td>

    <td class="celda-linea2">
      <${Pildora} estado=${o.estado} />
    </td>

    <td class="celda-accion der">
      ${o.cadena.soporte
        ? html`<button class="btn" disabled=${subiendo}
            onClick=${() => alSubir(o.id, false)}>
            ${subiendo ? 'Subiendo…' : 'Cambiar soporte'}</button>`
        : html`<button class="btn" disabled=${subiendo}
            onClick=${() => alSubir(o.id, false)}>
            <${Icono} nombre="subir" /> ${subiendo ? 'Subiendo…' : 'Subir soporte'}</button>`}
    </td>
  </tr>`;
}

/**
 * La revision del soporte, obligatoria antes de enviar.
 *
 * Un PDF con el nombre correcto puede tener dentro la declaracion de otro
 * municipio. Eso no se descubre hasta que la oficina lo recibe, y entonces ya
 * se mando la declaracion de un municipio a la alcaldia de otro. Por eso hay
 * que VERLO, uno por uno, antes de que salga el correo.
 */
function RevisarSoportes({ soportes, alMarcar, alCerrar, trabajando, listos }) {
  const [i, setI] = useState(0);
  const s = soportes[i];
  if (!s) return null;

  const avanzar = () => setI((n) => Math.min(n + 1, soportes.length - 1));
  const todoListo = listos === soportes.length;

  const dato = (et, valor, nota) => html`<div class="ficha" key=${et}>
    <span class="sub">${et}</span>
    <b>${valor || '—'}</b>
    ${nota ? html`<span class="sub">${nota}</span>` : null}
  </div>`;

  return html`<div class="velo">
    <div class="modal modal-envio" role="dialog" aria-modal="true"
      aria-labelledby="t-rev">
      <div class="rev-cab">
        <div>
          <h2 id="t-rev">${s.municipio} · ${s.impuesto} · ${s.periodo}</h2>
          <p class="sub">${'Vence ' + (s.vencimiento || 'sin fecha') +
            ' · dependencia ' + (s.cod_oficina || '—')}</p>
        </div>
        <span class="rev-cuenta">${i + 1} de ${soportes.length}</span>
      </div>

      <div class="envio-cuerpo">
        <aside class="envio-datos">
          <p class="sub envio-titulo">Esto es lo que va en la comunicación</p>
          ${dato('Valor a girar', s.valor_texto)}
          ${dato('NIT del municipio', s.nit_municipio)}
          ${dato('Consecutivo de giro', s.consecutivo_giro)}
          ${dato('Sticker de correspondencia', s.adhesivo)}
          ${dato('Forma de pago', s.pago_texto)}
          ${dato('Destinatarios', s.destinatarios,
                 s.copias ? 'con copia a ' + s.copias_cuantas + ' más' : '')}
          ${dato('Archivo', s.nombre, s.peso_kb ? s.peso_kb + ' KB' : '')}
        </aside>

        <div class="envio-vista">
          ${s.vista
            ? html`<iframe class="rev-vista" src=${s.vista}
                title=${'Soporte de ' + s.municipio}></iframe>`
            : html`<p class="vacio">Esta obligación no tiene soporte.</p>`}
        </div>
      </div>

      <div class="modal-pie">
        <button class=${'btn ' + (s.revisado ? '' : 'btn-principal')}
          disabled=${trabajando}
          onClick=${async () => { await alMarcar(s.id, true, s.soporte_id); avanzar(); }}>
          ${s.revisado ? 'Verificado ✓' : 'El documento es correcto'}
        </button>
        <button class="btn btn-malo" disabled=${trabajando}
          onClick=${async () => {
            const r = await alMarcar(s.id, false, s.soporte_id);
            if (r !== 'cerrado') avanzar();
          }}>
          No corresponde
        </button>
        <span class="sub">${listos} de ${soportes.length} verificados</span>
        <button class=${'btn ' + (todoListo ? 'btn-principal' : '')}
          style=${{ marginLeft: 'auto' }}
          disabled=${trabajando} onClick=${alCerrar}>
          ${todoListo
            ? 'Autorizar el envío de ' + soportes.length +
              (soportes.length === 1 ? ' comunicación' : ' comunicaciones')
            : 'Cancelar'}
        </button>
      </div>
    </div>
  </div>`;
}

function Enviar({ inicio }) {
  const [datos, setDatos] = useState(inicio);
  const [ventana, setVentana] = useState(inicio.ventana || 'mes');
  const [filtro, setFiltro] = useState('todas');
  const [elegidas, setElegidas] = useState([]);
  const [confirmando, setConfirmando] = useState(false);
  const [trabajando, setTrabajando] = useState('');
  const [subiendo, setSubiendo] = useState('');
  const [resultado, setResultado] = useState(null);
  const [fallo, setFallo] = useState('');
  const [revision, setRevision] = useState(null);
  // el asistente de envio: datos -> revisar los PDF -> confirmar
  const [valorEnCurso, setValorEnCurso] = useState('');
  const archivo = useRef(null);
  const destino = useRef('');
  const anadir = useRef(false);        // true = anexo, false = reemplazar

  const filas = datos.filas || [];
  const visibles = useMemo(() => filas.filter((o) => aplicaFiltro(o, filtro)),
                           [filas, filtro]);

  // los conteos se calculan de la vista, y se recalculan en cada cambio
  const conteosVista = useMemo(() => {
    const c = { todas: filas.length, sin_soporte: 0, por_vencer: 0, vencidas: 0, listas: 0 };
    filas.forEach((o) => {
      if (!o.cadena.soporte) c.sin_soporte++;
      if (o.dias !== null && o.dias < 0) c.vencidas++;
      else if (o.dias !== null && o.dias <= 4) c.por_vencer++;
      if (o.enviable) c.listas++;
    });
    return c;
  }, [filas]);

  const elegiblesVisibles = visibles.filter((o) => o.enviable);
  const elegidasVivas = elegidas.filter((id) =>
    elegiblesVisibles.some((o) => o.id === id));

  const recargar = useCallback(async (v) => {
    setTrabajando('recargando');
    setFallo('');
    try {
      const d = await llamar('apiListaEnviar', v || ventana);
      setDatos((v) => Object.assign({}, v, d));
      setElegidas([]);
    } catch (e) {
      setFallo(String(e && e.message ? e.message : e));
    } finally {
      setTrabajando('');
    }
  }, []);

  function alternar(id) {
    setElegidas((v) => v.indexOf(id) >= 0 ? v.filter((x) => x !== id) : v.concat([id]));
    setResultado(null);
    setConfirmando(false);
  }

  function todasOninguna() {
    setElegidas(elegidasVivas.length === elegiblesVisibles.length
      ? [] : elegiblesVisibles.map((o) => o.id));
    setConfirmando(false);
  }

  /* -------- el valor, escrito en la propia tabla -------- */

  /**
   * Guarda el valor de una fila sin recargar la lista entera: el servidor
   * devuelve la fila ya decorada y se reemplaza solo esa.
   */
  async function guardarValor(id, texto) {
    setValorEnCurso(id);
    setFallo('');
    try {
      const r = await llamar('apiGuardarCampos', id, { valor: texto });
      if (r && r.fila) {
        setDatos((v) => Object.assign({}, v, {
          filas: (v.filas || []).map((f) => (f.id === id ? r.fila : f))
        }));
      }
      return true;
    } catch (e) {
      setFallo(String(e && e.message ? e.message : e));
      return false;
    } finally {
      setValorEnCurso('');
    }
  }

  /* -------- paso 1: los datos que el correo nombra -------- */

  /* -------- subir el soporte: un archivo por llamada -------- */

  function pedirArchivo(id, agregar) {
    destino.current = id;
    anadir.current = !!agregar;
    archivo.current.value = '';
    archivo.current.click();
  }

  async function recibirArchivo(ev) {
    const f = ev.target.files && ev.target.files[0];
    const id = destino.current;
    if (!f || !id) return;

    setSubiendo(id);
    setFallo('');
    try {
      const datosBase64 = await new Promise((ok, mal) => {
        const lector = new FileReader();
        lector.onload = () => ok(String(lector.result).split(',')[1]);
        lector.onerror = () => mal(new Error('No se pudo leer el archivo.'));
        lector.readAsDataURL(f);
      });
      const r = await llamar('apiSubirSoporte', id, f.name, f.type,
                             datosBase64, anadir.current);
      await recargar();
      setResultado({ clase: '',
        titulo: (anadir.current ? 'Anexo cargado: ' : 'Soporte cargado: ') + f.name,
        lineas: r && r.soportes > 1
          ? ['Esa obligación va con ' + r.soportes + ' archivos adjuntos. ' +
             'Al enviar hay que revisarlos todos.']
          : [] });
    } catch (e) {
      setFallo('No se pudo subir ' + f.name + '. ' + (e && e.message ? e.message : e));
    } finally {
      setSubiendo('');
      destino.current = '';
      anadir.current = false;
    }
  }

  /* -------- revisar los soportes: obligatorio antes de enviar -------- */

  /**
   * El botón de enviar. Si a alguna le falta un dato que el correo nombra, lo
   * dice y no abre nada: esos datos se corrigen en los datos, no aquí.
   */
  function empezarEnvio() {
    setResultado(null);
    setFallo('');
    const cojas = elegidasVivas
      .map((id) => filas.find((f) => f.id === id))
      .filter((o) => o && (o.falta_correo || []).length);
    if (cojas.length) {
      setResultado({ clase: 'malo',
        titulo: 'Hay datos pendientes',
        lineas: cojas.slice(0, 8).map((o) =>
          o.municipio + ' ' + o.impuesto + ' ' + o.periodo + ': ' +
          o.falta_correo.join(', '))
          .concat(cojas.length > 8 ? ['… y ' + (cojas.length - 8) + ' más'] : []) });
      return;
    }
    abrirRevision();
  }

  async function abrirRevision() {
    setTrabajando('revisando');
    setFallo('');
    try {
      const r = await llamar('apiSoportesParaRevisar', elegidasVivas);
      // El visor se abre siempre, aunque ya estén verificados: es la pantalla
      // donde se ven los datos que van en la comunicación y donde se autoriza.
      setRevision(r.soportes);
    } catch (e) {
      setFallo(String(e && e.message ? e.message : e));
    } finally {
      setTrabajando('');
    }
  }

  async function marcarSoporte(id, correcto, soporteId) {
    setTrabajando('marcando');
    try {
      await llamar('apiMarcarSoporte', id, correcto, '', soporteId);
      setRevision((v) => v.map((s) =>
        s.soporte_id === soporteId ? Object.assign({}, s, { revisado: correcto }) : s));
      if (!correcto) {
        // se cierra el visor y se vuelve a la lista, donde esa fila ya pide
        // «Subir soporte» otra vez
        const o = filas.find((f) => f.id === id);
        setElegidas((v) => v.filter((x) => x !== id));
        setRevision(null);
        setConfirmando(false);
        setResultado({ clase: 'malo',
          titulo: 'Soporte marcado como no válido',
          lineas: [
            frase(['Se quitó el archivo de',
                   o ? o.municipio + ' ' + o.impuesto + ' ' + o.periodo : 'la obligación',
                   'y volvió a PENDIENTE.']),
            'Sube el PDF correcto en su fila y vuelve a enviar.'
          ] });
        await recargar();
        return 'cerrado';
      }
    } catch (e) {
      setFallo(String(e && e.message ? e.message : e));
    } finally {
      setTrabajando('');
    }
  }

  /**
   * Cerrar el visor con todo verificado ES la autorización: el correo sale.
   * Antes había una confirmación más encima, y tres botones para mandar un
   * correo es uno de más.
   */
  async function cerrarRevision() {
    const total = (revision || []).length;
    const buenos = (revision || []).filter((s) => s.revisado).length;
    setRevision(null);
    if (total && buenos === total) {
      await enviarYa();
      return;
    }
    await recargar();
  }

  /* -------- enviar -------- */

  async function enviarYa() {
    setConfirmando(false);
    setTrabajando('enviando');
    setFallo('');
    try {
      const r = await llamar('apiEnviar', elegidasVivas);
      const lineas = r.rechazadas.map((x) => {
        const o = filas.find((f) => f.id === x.id);
        return (o ? o.municipio + ' ' + o.impuesto + ' ' + o.periodo : x.id) + ': ' + x.motivo;
      });
      if (r.pendientes.length) {
        lineas.push(r.pendientes.length + ' quedaron pendientes por el límite de tiempo' +
                    ' de Apps Script. Vuelve a seleccionarlas y envíalas.');
      }
      setResultado({
        clase: r.enviadas.length ? '' : 'malo',
        titulo: r.enviadas.length
          ? r.enviadas.length + (r.enviadas.length === 1 ? ' correo enviado' : ' correos enviados') +
            (r.modo === 'PRUEBA' ? ' a tu propia bandeja (modo prueba)' : '')
          : 'No se envió ninguno',
        lineas: lineas
      });
      setDatos((v) => Object.assign({}, v, { cuota: r.cuota }));
      await recargar();
    } catch (e) {
      setFallo(String(e && e.message ? e.message : e));
    } finally {
      setTrabajando('');
    }
  }

  const modo = (datos.config && datos.config.modo) || 'PRUEBA';
  const destinatarios = elegidasVivas.reduce((n, id) => {
    const o = filas.find((f) => f.id === id);
    return n + (o ? String(o.correo_oficina || '').split(',').filter(Boolean).length : 0);
  }, 0);

  return html`<main class="lienzo">
    <div class="titulo-fila">
      <div>
        <h1>Enviar</h1>
        <${Hallazgo} filas=${filas} conteos=${conteosVista} />
      </div>
      <div class="acciones-titulo">
        <label class="campo campo-linea">
          <span>Periodo</span>
          <select value=${ventana} disabled=${!!trabajando}
            onChange=${(e) => { setVentana(e.target.value); recargar(e.target.value); }}>
            ${VENTANAS.map((v) => html`<option key=${v.id} value=${v.id}>
              ${v.et}${datos.ventanas ? ' (' + (datos.ventanas[v.id] || 0) + ')' : ''}
            </option>`)}
          </select>
        </label>
        <button class="btn" onClick=${() => recargar()} disabled=${!!trabajando}>
          <${Icono} nombre="recargar" />
          ${trabajando === 'recargando' ? 'Actualizando…' : 'Actualizar'}
        </button>
        <button class="btn btn-principal"
          disabled=${!elegidasVivas.length || !!trabajando}
          onClick=${empezarEnvio}>
          ${trabajando === 'enviando'
            ? 'Enviando…'
            : 'Enviar seleccionadas (' + elegidasVivas.length + ')'}
        </button>
      </div>
    </div>

    <${TarjetasConteo} conteos=${conteosVista} filtro=${filtro}
      alFiltrar=${(f) => { setFiltro(f); setConfirmando(false); }} />

    ${modo === 'PRUEBA' && elegidasVivas.length ? html`<div class="confirmar">
      <p>Modo prueba: las ${elegidasVivas.length} comunicaciones llegarán a tu
        propia bandeja, no a las oficinas.</p>
    </div>` : null}

    ${resultado ? html`<div class=${'resultado ' + resultado.clase} role="status">
      <h2>${resultado.titulo}</h2>
      ${resultado.lineas.length ? html`<ul>
        ${resultado.lineas.map((l, i) => html`<li key=${i}>${l}</li>`)}
      </ul>` : null}
    </div>` : null}

    <section class="panel">
      <div class="panel-cab">
        <h2>Obligaciones por enviar</h2>
        <span class="total">${visibles.length} de ${filas.length}</span>
        <span class="der">
          ${datos.cuota ? datos.cuota.usada + ' de ' + datos.cuota.tope +
            ' destinatarios usados hoy' : ''}
          ${datos.generado ? ' · leído ' + datos.generado.slice(11) : ''}
        </span>
      </div>

      <table>
        <thead>
          <tr>
            <th class="celda-casilla">
              <input type="checkbox"
                checked=${!!elegiblesVisibles.length &&
                          elegidasVivas.length === elegiblesVisibles.length}
                disabled=${!elegiblesVisibles.length}
                aria-label="Seleccionar todas las que se pueden enviar"
                onChange=${todasOninguna} />
            </th>
            <th>Municipio</th>
            <th>Impuesto</th>
            <th class="num">Periodo</th>
            <th class="num der">Vence</th>
            <th class="num der">Valor</th>
            <th>Evidencia</th>
            <th>Estado</th>
            <th class="der">Soporte</th>
          </tr>
        </thead>

        ${trabajando === 'recargando' && !filas.length
          ? html`<${Huesos} filas=${3} />`
          : html`<tbody>
              ${visibles.map((o) => html`<${Fila} key=${o.id} o=${o}
                elegida=${elegidas.indexOf(o.id) >= 0}
                subiendo=${subiendo === o.id}
                alElegir=${alternar} alSubir=${pedirArchivo}
                alGuardarValor=${guardarValor}
                guardandoValor=${valorEnCurso === o.id} />`)}
            </tbody>`}
      </table>

      ${fallo ? html`<${ErrorBloque} mensaje=${fallo} cuando=${datos.generado
        ? datos.generado.slice(11) : ''} alReintentar=${recargar} />` : null}

      ${!fallo && !visibles.length ? html`<p class="vacio">
        ${filas.length
          ? 'Ninguna obligación cae en este filtro. Las otras ' + filas.length +
            ' siguen en "Por enviar".'
          : 'No hay obligaciones con requiere_envio = SI asignadas a ti.'}
      </p>` : null}
    </section>

    ${revision ? html`<${RevisarSoportes} soportes=${revision}
      alMarcar=${marcarSoporte} alCerrar=${cerrarRevision}
      trabajando=${!!trabajando}
      listos=${revision.filter((s) => s.revisado).length} />` : null}

    <input ref=${archivo} type="file" onChange=${recibirArchivo}
      style=${{ position: 'absolute', width: '1px', height: '1px', opacity: 0,
                pointerEvents: 'none' }}
      tabIndex="-1" aria-hidden="true" />
  </main>`;
}
</script>
